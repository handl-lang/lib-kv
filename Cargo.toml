[package]
name = "handl-plugin-lib-kv"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Key-value store abstraction for the handl runtime."
license = "MIT"
repository = "https://github.com/handl-lang/lib-kv"
homepage = "https://github.com/handl-lang/lib-kv"
readme = "README.md"

[dependencies]
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/kernel"]
handl-ops = { path = "../kernel/crates/handl-ops" }
